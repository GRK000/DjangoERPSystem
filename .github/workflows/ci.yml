name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  DEBUG: "true"
  SECRET_KEY: "ci-secret-key"
  ALLOWED_HOSTS: "127.0.0.1,localhost"
  AI_PROVIDER: "mock"
  AI_API_KEY: ""
  AI_BASE_URL: "https://api.groq.com/openai/v1"
  AI_MODEL: "mock"
  AI_TIMEOUT_SECONDS: "30"
  AI_MAX_OUTPUT_TOKENS: "800"
  AI_TEMPERATURE: "0.2"
  AGENT_MAX_TOOL_RESULTS: "20"
  AGENT_MAX_MESSAGE_LENGTH: "2000"
  AGENT_ENABLE_REAL_LLM: "false"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Django check
        run: python manage.py check

      - name: Django tests
        run: python manage.py test

      - name: Seed demo data
        run: python manage.py seed_demo_data --reset --quiet

      - name: Aurora Operator evals
        run: python manage.py agent_eval --dataset aurora_agent/evals/smoke.json --mock

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend if available
        working-directory: frontend
        run: npm run | grep -q " lint" && npm run lint || echo "No lint script defined"

      - name: Test frontend if available
        working-directory: frontend
        run: npm run | grep -q " test" && npm run test || echo "No test script defined"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "docker-compose.yml not found"
          fi

      - name: Docker build
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose build
          else
            docker build .
          fi
