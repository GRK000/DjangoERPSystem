{% extends 'base.html' %}

{% block title %}Iniciar Sessió{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-person-circle text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2 fw-bold">Iniciar Sessió</h3>
                            <p class="text-muted">Accedeix al teu compte</p>
                        </div>

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="id_username" class="form-label">Usuari</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" id="id_username" placeholder="El teu usuari" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="id_password" class="form-label">Contrasenya</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" id="id_password" placeholder="La teva contrasenya" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </form>

                        <hr>

                        <div class="text-center">
                            <p class="text-muted mb-0">No tens compte?</p>
                            <a href="{% url 'register' %}" class="fw-medium">Registra't aquí</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
